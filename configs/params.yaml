# ==============================================================================
# Parameter Konfigurasi Proyek MCCaR-KMA
# Sumber Kebenaran: docs/context/spesifikasi_model.md & Proposal Pasca-Sempro
# Nomor persamaan mengacu pada proposal.
# Parameter yang belum ditentukan diisi null dengan komentar "KEPUTUSAN TERBUKA Dx"
# ==============================================================================

project:
  name: "mccar_kma"
  title: "Optimasi Portofolio Utang Negara Multivaluta (MCCaR + KMA)"
  author: "Sultan Bakri Baihaqi Mahat"
  nrp: "5002221016"
  advisor: "Prof. Dr. Mohammad Isa Irawan, MT"

# ------------------------------------------------------------------------------
# 1. Konfigurasi Data & Jendela Analisis (Spesifikasi §2, §4, §12)
# ------------------------------------------------------------------------------
data:
  raw_file: "data/raw/Dataset_Utama_Optimum_Utang_Valas.xlsx"
  start_date: "2017-07-03" # Tanggal awal ketersediaan IR_JPY_5Y
  end_date: "2025-11-24"   # Observasi akhir jendela
  days_per_year: 252

  # D1 DIPUTUSKAN (2026-10-18): Opsi A "intersection"
  # Gunakan 2.028 baris data riil lengkap (buang 163 baris gap EUR_10Y).
  # Log-change yang melintasi celah 163 hari dikeluarkan (bukan dihitung sebagai perubahan harian).
  # Catatan keputusan: docs/decisions/0001-window-mode-intersection.md
  window_mode: "intersection"

# ------------------------------------------------------------------------------
# 2. Instrumen Utang & Batas Proporsi (Tabel 2.1, 2.2, Spesifikasi §2)
# ------------------------------------------------------------------------------
instruments:
  dimension: 7
  items:
    - id: 1
      name: "USD_Fixed_5Y"
      currency: "USD"
      tenor: 5
      yield_col: "IR_USD_5Y"
      w0: 0.459485835
      lb: 0.425
      ub: 0.490

    - id: 2
      name: "USD_Fixed_10Y"
      currency: "USD"
      tenor: 10
      yield_col: "IR_USD_10Y"
      w0: 0.113620854
      lb: 0.100
      ub: 0.125

    - id: 3
      name: "USD_Fixed_30Y"
      currency: "USD"
      tenor: 30
      yield_col: "IR_USD_30Y"
      w0: 0.147798763
      lb: 0.130
      ub: 0.165

    - id: 4
      name: "EUR_Fixed_7Y"
      currency: "EUR"
      tenor: 8
      yield_col: "IR_EUR_7Y"
      w0: 0.143927407
      lb: 0.130
      ub: 0.155

    - id: 5
      name: "EUR_Fixed_10Y"
      currency: "EUR"
      tenor: 10
      yield_col: "IR_EUR_10Y"
      w0: 0.024401992
      lb: 0.015
      ub: 0.030

    - id: 6
      name: "JPY_Fixed_5Y"
      currency: "JPY"
      tenor: 5
      yield_col: "IR_JPY_5Y"
      w0: 0.066688212
      lb: 0.050
      ub: 0.085

    - id: 7
      name: "JPY_Fixed_10Y"
      currency: "JPY"
      tenor: 10
      yield_col: "IR_JPY_10Y"
      w0: 0.044076937
      lb: 0.030
      ub: 0.055

currencies:
  usd:
    quote_format: "base" # USD = USD
  eur:
    fx_col: "FX_USD/EUR" # Unit EUR per 1 USD
  jpy:
    fx_col: "FX_USD/JPY" # Unit JPY per 1 USD

# Skenario batas proporsi: 'free' (0 <= w_i <= 1) atau 'djppr' (lb <= w_i <= ub)
boundary_scenarios:
  - "free"
  - "djppr"

# ------------------------------------------------------------------------------
# 3. Pembangkitan Skenario GBM (Persamaan 2.11–2.12, Spesifikasi §4)
# ------------------------------------------------------------------------------
scenarios:
  n_scenarios: 5000       # N = 5.000 skenario
  horizon_days: 252       # Horizon 1 tahun (252 hari kerja)
  dt: 0.003968253968253968 # 1 / 252

  # D2 DIPUTUSKAN (2026-10-18):
  # D2a: drift_calibration = "ito_annualized" (mu = 252*m + sigma^2/2, sigma = s*sqrt(252))
  # D2b: simulation_path_mode = "terminal_1step" (lompatan langsung T=1 tahun)
  # D2c: historical_cost_x0 = "window_end" (kurs observasi terakhir jendela 2025-11-24)
  # Catatan keputusan: docs/decisions/0002-gbm-calibration.md
  drift_calibration: "ito_annualized"
  simulation_path_mode: "terminal_1step"
  historical_cost_x0: "window_end"

  train_seed: 42          # Seed generator acak bank latih utama N=5.000

  # D3 DIPUTUSKAN (2026-10-18):
  # Ukuran bank validasi independen: N_valid = 20.000 skenario
  # Seed generator acak bank validasi: validation_seed = 2026
  # Catatan keputusan: docs/decisions/0003-validation-bank-specification.md
  validation_scenarios: 20000
  validation_seed: 2026

# ------------------------------------------------------------------------------
# 4. Ukuran Risiko & Biaya Portofolio (Persamaan 2.13–2.20, Spesifikasi §5)
# ------------------------------------------------------------------------------
risk:
  alpha: 0.95            # Tingkat kepercayaan 95% (Persamaan 2.13)
  m_tail: 250            # m = ceil((1 - alpha) * N) = 250 untuk N = 5000
  delta: 0.01            # Tambahan penerbitan delta = 1% (Persamaan 2.14)

  # D5 DIPUTUSKAN (2026-10-18):
  # Toleransi pembagian MC_i mendekati nol: jika |MC_i| <= zero_tolerance_mc, set theta_i = 0.0
  # Catatan keputusan: docs/decisions/0004-risk-evaluator-d5.md
  zero_tolerance_mc: 1.0e-12

# Definisi biaya portofolio:
# 'gross': Persamaan 2.2 (C_{i,s} = q_{c(i),s} * (1 + y_{i,s}/100))
# 'interest': Persamaan 2.3 (C^I_{i,s} = q_{c(i),s} * (y_{i,s}/100))
cost_definitions:
  - "gross"
  - "interest"

# ------------------------------------------------------------------------------
# 5. Model Optimasi & Penalti Kendala (Persamaan 2.21–2.24, Spesifikasi §6)
# ------------------------------------------------------------------------------
optimization:
  penalty_rho_J: 1.0e+6   # rho_J = 1e6 (Persamaan 2.24)
  penalty_rho_R: 1.0e+6   # rho_R = 1e6 (Persamaan 2.24)
  eps_tol: 1.0e-8         # Toleransi kelayakan numerik epsilon_tol = 1e-8
  projection_max_iter: 1000 # Iterasi maksimum proyeksi kendala sum(w)=1 dan batas proporsi

# ------------------------------------------------------------------------------
# 6. Desain Eksperimen (Tabel 3.1, Spesifikasi §8)
# ------------------------------------------------------------------------------
experiments:
  base_seed: 42            # Seed dasar deterministik (seed_k = base_seed + k)
  budget_evaluations: 25000 # Anggaran evaluasi fungsi per run/replikasi
  replications: 30         # 30 replikasi per konfigurasi per algoritma
  algorithms:
    - "kma"
    - "ga"
    - "pso"
  configurations:
    - "gross_free"
    - "gross_djppr"
    - "interest_free"
    - "interest_djppr"

  # D8 DIPUTUSKAN (2026-10-18):
  # Prosedur pembangkitan 1.000 kombinasi bobot acak DJPPR (acuan historis):
  # Opsi A: "rejection" (rejection sampling pada bobot ternormalisasi uniform)
  # Catatan keputusan: docs/decisions/0005-risk-limits-d8-sampling.md
  random_benchmark_count: 1000
  random_benchmark_method: "rejection"
  random_benchmark_seed: 42

# ------------------------------------------------------------------------------
# 7. Parameter Metaheuristik (Spesifikasi §7)
# ------------------------------------------------------------------------------
algorithms:
  # 7.1 Komodo Mlipir Algorithm (KMA) - Subbab 2.8, Algoritma 1
  kma:
    phase_1:
      n_pop: 5             # Ukuran populasi fase 1
      mlipir_rate: 0.8571428571428571 # d = (D - 1) / D = 6 / 7
      budget: 5000         # 5.000 evaluasi
    phase_2:
      n_pop_init: 200      # Ukuran populasi awal fase 2
      n_pop_min: 20        # Batas bawah ukuran populasi
      n_pop_max: 200       # Batas atas ukuran populasi
      budget: 20000        # Sisa anggaran 20.000 evaluasi

    # D4 DIPUTUSKAN (2026-10-18):
    p_bm: 0.5
    gamma: 0.1
    q_interactions: null # null = seluruh n_bm
    p_mating: 0.5
    stagnation_patience: 2
    stagnation_tol: 1.0e-7
    delta_n: 5
    phase_transition_strategy: "inherit_best_with_random_diversity"

  # 7.2 Genetic Algorithm (GA) - Subbab 2.9.1
  ga:
    n_pop: 50              # Ukuran populasi GA
    tournament_size: 2    # Seleksi turnamen ukuran 2
    p_crossover: 0.9      # Peluang persilangan aritmetika
    p_mutation: 0.14285714285714285 # Peluang mutasi per dimensi (1 / D = 1 / 7)
    sigma_m_factor: 0.1   # Standar deviasi mutasi Gaussian = 0.1 * rentang

    # D6 DIPUTUSKAN (2026-10-18):
    elitism_count: 2

  # 7.3 Particle Swarm Optimization (PSO) - Subbab 2.9.2
  pso:
    n_pop: 50              # Ukuran kawanan partikel PSO
    w_start: 0.9          # Bobot inersia awal
    w_end: 0.4            # Bobot inersia akhir (turun linear)
    c1: 1.49618           # Koefisien akselerasi kognitif
    c2: 1.49618           # Koefisien akselerasi sosial
    v_max_factor: 0.2     # v_max_i = 0.2 * (ub_i - lb_i)

    # D6 DIPUTUSKAN (2026-10-18):
    velocity_clamp_strategy: "effective_displacement"
    inertia_schedule: "evaluations_linear"
    shared_init_strategy: "uniform_box_projected"

# ------------------------------------------------------------------------------
# 8. Analisis Statistik (Spesifikasi §9, §12)
# ------------------------------------------------------------------------------
analysis:
  significance_level: 0.05
  tests:
    - "shapiro_wilk"
    - "levene"
    - "kruskal_wallis"
    - "dunn_holm"
    - "rank_biserial"

  # KEPUTUSAN D7 (DIPUTUSKAN 2026-10-18):
  # Penanganan ties pada uji Dunn menggunakan faktor koreksi ties C_ties (Glantz, 2012)
  dunn_ties_correction: true

# ------------------------------------------------------------------------------
# 9. Studi Stabilitas Batas Risiko (Tahap 17; KEPUTUSAN D10 TERBUKA)
# Anggaran, konfigurasi, N bank, dan seed validasi dipakai ulang dari blok
# experiments / scenarios (tidak diduplikasi di sini).
# ------------------------------------------------------------------------------
sensitivity_limits:
  n_banks: 20                  # B bank latih independen
  bank_seed_base: 10000        # seed bank ke-b = bank_seed_base + b
  optimizer_seed_base: 20000   # seed optimizer ke-b = base + b (sama untuk PSO dan GA)
  replications_per_bank: 1
  algorithms: ["pso", "ga"]
  n_workers: 6
  bootstrap_resamples: 10000
  bootstrap_seed: 30000
  confidence_level: 0.95
  tie_relative_tolerance: 1.0e-8   # batas seri pada Win-Tie-Loss
  output_dir: "results/sensitivity/limits"

# ------------------------------------------------------------------------------
# 10. Diagnosis KMA v2 (Tahap 18; D11 ditinjau ulang 2026-10-25: Opsi A dipertahankan)
# Parameter algoritma = blok `algorithms` (default kelas optimizer, sama dgn 360 run).
# Bank latih & batas risiko = bank seed `scenarios.train_seed` (sama dgn 360 run).
# Seed di sini terpisah dari 42, 2026, 43-72 (replikasi utama), 101-130 (diagnosis
# lama), 10000-10019 / 20000-20039 / 30000 (Tahap 17).
# ------------------------------------------------------------------------------
kma_diagnosis:
  output_dir: "results/sensitivity/kma"
  n_workers: 6
  budget: 25000
  checkpoints: [5000, 10000, 25000]
  projection_distance_tol: 1.0e-9   # jarak raw->proyeksi di atas ini = "terproyeksi"
  bound_tol: 1.0e-12                # koordinat dianggap menempel di lb/ub
  log_floor: 1.0e-12                # lantai sumbu log pada grafik
  smoke:
    budget: 500
    replications: 2
  benchmark:
    functions: ["sphere", "rastrigin", "rosenbrock"]
    domains:
      sphere: [-100.0, 100.0]
      rastrigin: [-5.12, 5.12]
      rosenbrock: [-30.0, 30.0]
    replications: 30
    seed_base: 40000               # seed rep r = seed_base + r (sama utk semua algoritma)
    algorithms: ["kma", "ga", "pso"]
    dims_stage_a: [7, 30]
    dims_stage_b: [50]             # dimensi Tabel 2 Suyanto dkk. (2022)
    shifted_dims: [7, 30]
    shifted_algorithms: ["kma", "kma_paper_all", "ga", "pso"]
    shift_seed_base: 41000         # seed vektor geser = base + 100*indeks_fungsi + D
    shift_domain_fraction: 0.8     # optimum tergeser di [0,8*lb, 0,8*ub]
    variant_dims: [7, 30]
    variants: ["paper_pool", "sync", "paper_mlipir", "paper_q", "paper_all"]
  portfolio_ablation:
    configurations: ["gross_free", "gross_djppr", "interest_free", "interest_djppr"]
    replications: 30
    seed_base: 42000
    variants: ["default", "one_phase_n5", "one_phase_n200", "d2_low", "d2_high",
               "paper_pool", "paper_mlipir", "deb_rules", "norm_q"]
  instrumentation:
    algorithms: ["kma", "ga", "pso"]
    replications: 10
    seed_base: 43000
    block_size: 250
    near_boundary_rel_slack: 1.0e-3
  timing:
    algorithms: ["kma", "ga", "pso"]
    replications: 5
    seed_base: 44000
    profile_seed: 45001
  # Tabel 2 Suyanto dkk. (2022): D=50, 25.000 evaluasi, 30 run (F1 Sphere, F5 Rosenbrock, F9 Rastrigin)
  reference_suyanto_2022:
    dim: 50
    kma:
      sphere: {avg: 0.0, std: 0.0}
      rosenbrock: {avg: 48.31, std: 0.182}
      rastrigin: {avg: 0.0, std: 0.0}
    ga:
      sphere: {avg: 43.80, std: 5.257}
      rosenbrock: {avg: 634.7, std: 130.0}
      rastrigin: {avg: 121.3, std: 15.09}
